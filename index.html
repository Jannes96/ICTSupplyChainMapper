<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IKT-Lieferketten-Mapper (DORA Art. 28 Abs. 3)</title>
    <meta
      name="description"
      content="Prüfwerkzeug für IKT-Weiterverlagerungsketten im Informationsregister nach DORA Art. 28 Abs. 3. Der Rang wird aus dem Graphen berechnet und dem gemeldeten Rang gegenübergestellt."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!--
      The preview card that appears when the link is pasted into a message, a
      mail or an application. Without these the card is blank, which for a link
      meant to be shared is the whole point missed. og:image needs an absolute
      URL — relative paths are not resolved by the services that render it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ICT Supply Chain Mapper" />
    <meta property="og:title" content="IKT-Lieferketten-Mapper — DORA Art. 28 Abs. 3" />
    <meta
      property="og:description"
      content="Weiterverlagerungsketten sichtbar machen und prüfen: Der Rang wird aus den erfassten Beziehungen berechnet statt gepflegt — Abweichungen zur Meldung werden als Befund ausgewiesen."
    />
    <meta property="og:url" content="https://jannes96.github.io/ICTSupplyChainMapper/" />
    <meta
      property="og:image"
      content="https://jannes96.github.io/ICTSupplyChainMapper/vorschau.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Radiales Diagramm einer IKT-Lieferkette: Finanzunternehmen im Zentrum, Ränge als Ringe."
    />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
