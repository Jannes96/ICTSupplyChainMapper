name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half-way: an interrupted
# deployment would leave the published site in an undefined state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lock file and package.json disagree. `npm install` would quietly resolve
      # newer versions and make the build depend on the day it ran.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # Also produces the artefact the deployment publishes, so the site can
      # only go live from a commit whose tests passed.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: check
    # Pull requests are checked but not published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
