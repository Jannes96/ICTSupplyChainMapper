<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The diagram in miniature: the financial entity at the centre, two ranks as
    rings around it, with the gap that a chain ending early leaves behind.
    Colours follow the reader's theme, so the mark stays visible on a light and
    on a dark browser tab alike.
  -->
  <style>
    .ink { fill: #2b5f9e; stroke: #2b5f9e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #86b4e8; stroke: #86b4e8; }
    }
  </style>
  <g class="ink" fill="none" stroke-linecap="round" transform="rotate(-90 16 16)">
    <circle cx="16" cy="16" r="4" stroke="none" />
    <circle cx="16" cy="16" r="9" stroke-width="3" stroke-dasharray="44 12.5" />
    <circle cx="16" cy="16" r="13.5" stroke-width="3" stroke-dasharray="60 24.8" />
  </g>
</svg>
